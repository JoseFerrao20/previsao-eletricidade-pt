[project]
name = "previsao-eletricidade-pt"
version = "0.1.0"
description = "Previsão do consumo e da produção eólica e solar em Portugal (REN Data Hub) a 24-48 h, com MLOps."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "holidays>=0.60",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "plotly>=5.24",
]

[project.scripts]
eletricidade = "eletricidade.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eletricidade"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
