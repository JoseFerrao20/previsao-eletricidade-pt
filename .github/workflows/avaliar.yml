name: avaliar

# Avaliação de uma alteração (branch) com dados reais, sem efeitos laterais:
# não toca no branch `estado`, não promove modelos e não escreve no `main`.
# Corre o mesmo backtest semana a semana do `retreino` e publica as tabelas no
# resumo da execução e como artefacto, para comparar com o `main`.
on:
  workflow_dispatch:
    inputs:
      semanas:
        description: Semanas de backtest
        default: "52"
      regra_meteo:
        description: Regra da corrida meteorológica (fresca ou conservadora)
        default: fresca
      ultima_semana:
        description: Segunda-feira da última semana de teste (vazio = a mais recente)
        default: ""

permissions:
  contents: read

jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELETRICIDADE_REGRA_METEO: ${{ inputs.regra_meteo }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen

      - name: Dados brutos (restaurar cache)
        uses: actions/cache/restore@v5
        with:
          path: dados
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - name: Ingestão incremental (REN + Open-Meteo)
        timeout-minutes: 110
        run: uv run eletricidade ingest

      - name: Dados brutos (guardar cache, mesmo com falhas)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: dados
          key: dados-${{ github.run_id }}

      - name: Backtest
        env:
          SEMANAS: ${{ inputs.semanas }}
          ULTIMA: ${{ inputs.ultima_semana }}
        run: uv run eletricidade backtest --semanas "$SEMANAS" ${ULTIMA:+--ultima-semana "$ULTIMA"}

      - name: Tabelas no log (para quem não pode descarregar artefactos)
        run: |
          for f in artefactos/*.md artefactos/backtest_resumo.csv artefactos/backtest_por_lead.csv \
                   artefactos/backtest_segmentos.csv artefactos/backtest_intervalos.csv; do
            if [ -f "$f" ]; then echo "=== $f"; cat "$f"; fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: avaliacao-${{ github.ref_name }}
          path: artefactos/*.csv
