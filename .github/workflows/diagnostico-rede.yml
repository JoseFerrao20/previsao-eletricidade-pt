name: diagnostico-rede

# Verifica, a partir de um runner, se as APIs respondem ao cliente do projeto
# (identificado com o seu próprio User-Agent). Só leitura; corre à mão.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rede:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pedidos de teste
        shell: bash
        run: |
          set +e
          BASE="https://servicebus.ren.pt/datahubapi/electricity"
          DIA="$(date -u -d '3 days ago' +%F)"
          UA="previsao-eletricidade-pt (+https://github.com/${GITHUB_REPOSITORY})"
          teste() {
            nome="$1"; shift
            echo "::group::$nome"
            curl -sS -A "$UA" -o corpo.txt -m 25 \
              -w "HTTP %{http_code} | ip %{remote_ip} | ligação %{time_connect}s | TLS %{time_appconnect}s | total %{time_total}s | %{size_download} B\n" "$@"
            echo "rc=$?"; head -c 300 corpo.txt; echo
            echo "::endgroup::"
          }
          getent hosts servicebus.ren.pt datahub.ren.pt
          teste "REN ProductionBreakdownDaily pt-PT" "$BASE/ElectricityProductionBreakdownDaily?date=$DIA&culture=pt-PT"
          teste "REN ProductionBreakdownDaily en-GB" "$BASE/ElectricityProductionBreakdownDaily?date=$DIA&culture=en-GB"
          teste "REN ConsumptionSupplyDaily" "$BASE/ElectricityConsumptionSupplyDaily?date=$DIA&culture=pt-PT"
          teste "REN HTTP/1.1 IPv4" --http1.1 -4 "$BASE/ElectricityProductionBreakdownDaily?date=$DIA&culture=pt-PT"
          teste "servicebus.ren.pt (raiz)" "https://servicebus.ren.pt/"
          teste "datahub.ren.pt" "https://datahub.ren.pt/"
          teste "Open-Meteo Previous Runs" "https://previous-runs-api.open-meteo.com/v1/forecast?latitude=38.72&longitude=-9.14&hourly=temperature_2m_previous_day2,wind_speed_100m_previous_day3&past_days=3&forecast_days=1&timezone=GMT"
          echo "::group::Séries (nomes) e pontos por série, $DIA"
          curl -sS -A "$UA" -m 25 "$BASE/ElectricityProductionBreakdownDaily?date=$DIA&culture=pt-PT" \
            | jq -c '{xAxis_tipo: (.xAxis|type), n_cat: ((.xAxis.categories // .xAxis[0].categories)|length), series: [.series[] | {name, n: (.data|length), exemplo: .data[40]}]}'
          echo "::endgroup::"
          for D in 2024-01-01 2024-06-15 2025-01-01 2025-10-26 2026-03-29; do
            teste "REN data antiga $D" "$BASE/ElectricityProductionBreakdownDaily?date=$D&culture=pt-PT"
            jq -c '{n_cat: ((.xAxis.categories // .xAxis[0].categories)|length), primeiras: ((.xAxis.categories // .xAxis[0].categories)[0:3]), ultimas: ((.xAxis.categories // .xAxis[0].categories)[-3:]), n_por_serie: [.series[].data|length]|unique}' corpo.txt
          done
      - name: Mesmo pedido com Python requests (cliente do projeto)
        shell: bash
        run: |
          python3 -m pip install --quiet requests || true
          python3 - <<'PY'
          import time, requests
          url = "https://servicebus.ren.pt/datahubapi/electricity/ElectricityProductionBreakdownDaily"
          for dia in ["2026-11-01", "2024-01-01"]:
              for nome, hdr in [("Accept json + UA", {"Accept": "application/json", "User-Agent": "previsao-eletricidade-pt"}),
                                ("só UA", {"User-Agent": "previsao-eletricidade-pt"})]:
                  t = time.time()
                  try:
                      r = requests.get(url, params={"date": dia, "culture": "pt-PT"}, headers=hdr, timeout=(10, 25))
                      print(dia, nome, r.status_code, len(r.content), f"{time.time()-t:.1f}s", r.url)
                  except Exception as e:
                      print(dia, nome, "ERRO", type(e).__name__, f"{time.time()-t:.1f}s")
          PY

      - name: Open-Meteo Previous Runs com vários modelos (formato e cobertura)
        shell: bash
        run: |
          set +e
          URL="https://previous-runs-api.open-meteo.com/v1/forecast"
          VARS="temperature_2m_previous_day1,wind_speed_100m_previous_day1,shortwave_radiation_previous_day1,wind_speed_100m_previous_day3"
          MODELOS="ecmwf_ifs025,gfs_seamless,icon_seamless,meteofrance_seamless"
          for periodo in "start_date=2024-01-15&end_date=2024-01-16" "past_days=2&forecast_days=1"; do
            echo "::group::$periodo"
            curl -sS -m 60 -A "previsao-eletricidade-pt (+https://github.com/${GITHUB_REPOSITORY})" \
              "$URL?latitude=40.57&longitude=-8.17&hourly=$VARS&models=$MODELOS&wind_speed_unit=ms&timezone=GMT&$periodo" \
              | jq -c '{erro: .reason, chaves: (.hourly // {} | keys), nulos: (.hourly // {} | with_entries(select(.key != "time")) | map_values([.[] | select(. == null)] | length)), n: (.hourly.time // [] | length)}'
            echo "::endgroup::"
          done

      - name: Open-Meteo Previous Runs - início do arquivo por modelo
        shell: bash
        run: |
          set +e
          URL="https://previous-runs-api.open-meteo.com/v1/forecast"
          for d in 2024-03-15 2024-06-15 2024-09-15 2024-12-15 2025-03-15 2025-06-15 2025-09-15; do
            r=$(curl -sS -m 60 -A "previsao-eletricidade-pt (+https://github.com/${GITHUB_REPOSITORY})" \
              "$URL?latitude=40.57&longitude=-8.17&hourly=wind_speed_100m_previous_day2&models=best_match,ecmwf_ifs025,gfs_seamless,icon_seamless,meteofrance_seamless&wind_speed_unit=ms&timezone=GMT&start_date=$d&end_date=$d" \
              | jq -c '.hourly // {} | with_entries(select(.key != "time")) | map_values([.[] | select(. != null)] | length)')
            echo "$d $r"
            sleep 2
          done
